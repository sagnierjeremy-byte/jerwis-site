<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OG Root Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Archivo', sans-serif;
    background: #0A0A0A;
    color: #FBF7F0;
    position: relative;
  }
  .stripe-top {
    position: absolute; top: 0; left: 0; right: 0; height: 14px;
    background: linear-gradient(90deg, #00B2A9 0%, #00B2A9 33.33%, #EF426F 33.33%, #EF426F 66.66%, #FF8200 66.66%, #FF8200 100%);
  }
  .stripe-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 14px;
    background: linear-gradient(90deg, #00B2A9 0%, #00B2A9 33.33%, #EF426F 33.33%, #EF426F 66.66%, #FF8200 66.66%, #FF8200 100%);
  }
  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 50% at 15% 30%, rgba(239,66,111,.22), transparent 60%),
                radial-gradient(50% 45% at 90% 80%, rgba(0,178,169,.20), transparent 60%);
  }
  .container {
    position: relative;
    width: 100%; height: 100%;
    padding: 80px 80px 90px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #BCB7AE;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .kicker::before {
    content: "";
    width: 14px; height: 14px; border-radius: 50%;
    background: #EF426F;
  }
  .kicker.dot-fuchsia::before { background: #EF426F; }
  .kicker.dot-teal::before    { background: #00B2A9; }
  .kicker.dot-orange::before  { background: #FF8200; }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 96px;
    line-height: .92;
    letter-spacing: -.04em;
    text-transform: uppercase;
    color: #FBF7F0;
    max-width: 1000px;
  }
  h1.size-md { font-size: 84px; }
  h1.size-sm { font-size: 72px; }
  h1 .accent-fuchsia { color: #EF426F; }
  h1 .accent-teal    { color: #00B2A9; }
  h1 .accent-orange  { color: #FF8200; }
  .tagline {
    font-family: 'Archivo', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: #BCB7AE;
    line-height: 1.3;
    margin-top: 26px;
    max-width: 900px;
  }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #FBF7F0;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .url::before {
    content: "→";
    color: #EF426F;
  }
  .signature {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #6E6E6E;
  }
</style>
</head>
<body>
  <div class="stripe-top"></div>
  <div class="glow"></div>
  <div class="container">
    <div class="head-block">
      <div class="kicker" id="kicker">Jerwis.fr</div>
    </div>
    <div class="text-block">
      <h1 id="title">Titre</h1>
      <p class="tagline" id="tagline">Sous-titre</p>
    </div>
    <div class="footer-row">
      <div class="url">jerwis.fr</div>
      <div class="signature">Jérémy Sagnier · pas dev</div>
    </div>
  </div>
  <div class="stripe-bottom"></div>

<script>
const COVERS = {
  "lexique": {
    kicker: "Lexique · jerwis.fr",
    h1: "Lexique <span class=\"accent-teal\">IA</span>.<br>62 termes,<br><span class=\"accent-fuchsia\">zéro jargon.</span>",
    tagline: "Tous les mots de l'IA expliqués comme à un ami. Pour comprendre sans bloquer.",
    accent: "teal",
    size: "md"
  },
  "claude-code": {
    kicker: "Guide · Claude Code",
    h1: "Claude Code,<br>le guide complet<br><span class=\"accent-fuchsia\">par un non-dev.</span>",
    tagline: "Tout ce que j'ai appris en 6 mois d'utilisation quotidienne. Sans être développeur.",
    accent: "fuchsia",
    size: "md"
  },
  "apprendre": {
    kicker: "Parcours · jerwis.fr",
    h1: "Apprendre <span class=\"accent-fuchsia\">l'IA.</span><br>Dans l'ordre<br>où je l'ai <span class=\"accent-teal\">apprise.</span>",
    tagline: "Le parcours en 3 étapes pour passer de zéro à autonome. Sans y passer tes soirées.",
    accent: "fuchsia",
    size: "md"
  },
  "modeles-ia": {
    kicker: "Comparatif · Modèles IA",
    h1: "Quel modèle <span class=\"accent-orange\">IA</span><br>choisir ?<br><span class=\"accent-fuchsia\">35 modèles classés.</span>",
    tagline: "GPT, Claude, Gemini, Mistral. Forces, faiblesses, prix. Pour choisir sans se tromper.",
    accent: "orange",
    size: "md"
  },
  "modeles-image-ia": {
    kicker: "Guide · Image · vidéo · audio",
    h1: "<span class=\"accent-teal\">Image.</span><br><span class=\"accent-fuchsia\">Vidéo.</span> <span class=\"accent-orange\">Audio.</span><br>L'IA générative.",
    tagline: "Midjourney, Veo, Sora, ElevenLabs. Quel outil pour quoi, et combien ça coûte.",
    accent: "fuchsia",
    size: "md"
  },
  "workflows": {
    kicker: "Workflows · Claude Code",
    h1: "Workflows<br>Claude Code.<br><span class=\"accent-teal\">Par métier.</span>",
    tagline: "Pas par techno. Par cas d'usage réel. Pour appliquer dès aujourd'hui dans ton job.",
    accent: "teal",
    size: "md"
  },
  "podcast": {
    kicker: "Podcast · Jerwis Productions",
    h1: "<span class=\"accent-fuchsia\">Guerres</span><br>d'<span class=\"accent-teal\">IA.</span><br>Le podcast.",
    tagline: "Trois épisodes narratifs sur la guerre des IA. Voix clonées, stack ouverte, dispo partout.",
    accent: "fuchsia"
  },
  "outils": {
    kicker: "Stack · Outils IA",
    h1: "Ma stack<br>outils <span class=\"accent-orange\">IA.</span><br><span class=\"accent-fuchsia\">30 outils testés.</span>",
    tagline: "Les outils que j'utilise vraiment au quotidien. Coûts réels, alternatives gratuites, pièges évités.",
    accent: "orange",
    size: "md"
  }
};

const params = new URLSearchParams(location.search);
const slug = params.get("slug");
const data = COVERS[slug];

if (data) {
  const kickerEl = document.getElementById("kicker");
  kickerEl.innerHTML = data.kicker;
  kickerEl.classList.add("dot-" + data.accent);
  const h1 = document.getElementById("title");
  h1.innerHTML = data.h1;
  if (data.size) h1.classList.add("size-" + data.size);
  document.getElementById("tagline").textContent = data.tagline;
} else {
  document.getElementById("title").textContent = "Slug inconnu : " + slug;
}
</script>
</body>
</html>
