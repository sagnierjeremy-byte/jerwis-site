name: Blog autopilot

# FULL-AUTO : génère un article, le passe à la gate qualité, et le PUBLIE tout seul
# si score ≥56/70 sans bloquant. Aucune validation, aucune notification sur publication.
# Si la gate ne passe pas → article jeté en silence (sujet sorti de la file).
# Alerte GitHub UNIQUEMENT si le système plante (clé API, quota, publication cassée).
# File de sujets (plan du 02-11-2026) : à 4 sujets ou moins, refill-topics.mjs en ajoute 8
# tirés de la veille, et notify-queue.mjs prévient par e-mail (ajout, 4 restants, ou file
# vide le lundi). Posts LinkedIn : programmation Zernio seulement si la variable repo
# BLOG_LINKEDIN vaut 'on' (coupée par défaut depuis le 02-11, le texte part dans le mail).

on:
  schedule:
    - cron: '0 5 * * 1,2,4,5'   # lun + mar + jeu + ven, 5h UTC = 7h Paris (4 articles/semaine)
  workflow_dispatch:         # déclenchement manuel depuis l'onglet Actions

# jamais 2 runs en parallèle (anti-emballement)
concurrency:
  group: blog-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # KILL SWITCH : régler la variable repo BLOG_AUTOPILOT sur 'off' pour mettre en pause
    if: ${{ vars.BLOG_AUTOPILOT != 'off' }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # historique complet → rebase fiable en cas de collision de push

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'   # OG générée par sharp (pur Node), aucun navigateur requis
        run: npm ci

      - name: Génère + publie (si la gate passe)
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE: ${{ secrets.CLAUDE }}   # tolère le secret nommé CLAUDE (fallback)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # juges Kimi K2.6 + fallback génération
        run: |
          node scripts/blog/autopilot.mjs
          {
            echo "status=$(sed -n '1p' /tmp/autopilot-status.txt)"
            echo "slug=$(sed -n '2p' /tmp/autopilot-status.txt)"
            echo "type=$(sed -n '3p' /tmp/autopilot-status.txt)"
            echo "url=$(sed -n '5p' /tmp/autopilot-status.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Traduit en anglais (catch-up, non bloquant)
        if: steps.gen.outputs.status == 'published'
        continue-on-error: true   # un échec de traduction ne bloque JAMAIS la publication FR ; rattrapé au run suivant
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE: ${{ secrets.CLAUDE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/i18n/translate-missing-en.mjs

      - name: En-tête et pied « revue » (non bloquant)
        if: steps.gen.outputs.status == 'published'
        continue-on-error: true   # remet l'en-tête et le pied de référence, surtout sur l'article anglais traduit
        run: node scripts/revue-entete-pied.mjs

      - name: Post LinkedIn + programmation Zernio J+1 (non bloquant)
        id: li
        if: steps.gen.outputs.status == 'published'
        continue-on-error: true   # un post raté ne bloque jamais la publication ; le mail partira sans le bloc LinkedIn
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE: ${{ secrets.CLAUDE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BLOG_LINKEDIN: ${{ vars.BLOG_LINKEDIN }}
          LI_ACCOUNT: 69c06ed66cb7b8cf4c8f5689   # profil LinkedIn perso de Jérémy dans Zernio
        run: |
          node scripts/blog/linkedin-post.mjs "${{ steps.gen.outputs.slug }}"
          # Carrousel PDF si le post s'y prête (chiffre fort ou méthode) — livré en pièce jointe du mail
          node scripts/blog/linkedin-carousel.mjs "${{ steps.gen.outputs.slug }}" || echo "carrousel : skip ou échec (non bloquant)"
          # Programme sur LinkedIn demain 8h30 Paris, seulement si BLOG_LINKEDIN=on (coupé le 02-11 :
          # le post part dans le mail, prêt à coller). Échec = mail sans mention, à programmer à la main.
          if [ "$BLOG_LINKEDIN" != "on" ]; then
            echo "Programmation LinkedIn coupée (variable BLOG_LINKEDIN ≠ on)."
            echo "scheduled=off" >> "$GITHUB_OUTPUT"
          elif [ -n "$ZERNIO_API_KEY" ] && node scripts/blog/zernio-schedule.mjs "${{ steps.gen.outputs.slug }}" tomorrow@08:30 --account="$LI_ACCOUNT"; then
            echo "scheduled=oui" >> "$GITHUB_OUTPUT"
          else
            echo "scheduled=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Remplit la file de sujets (si 4 ou moins, non bloquant)
        continue-on-error: true   # raté = réessai au passage suivant, la file étant toujours sous le seuil
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE: ${{ secrets.CLAUDE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/blog/refill-topics.mjs

      - name: Commit + push (publication ou file modifiée)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.gen.outputs.status }}" = "published" ]; then
            # Checkout CI vierge (origin/main) → git add -A ne capture QUE les artefacts de publication
            # (article HTML, articles.html, sitemap, RSS, OG, draft, topic-queue). research/ est gitignoré.
            git add -A
            message="feat(blog): publie '${{ steps.gen.outputs.slug }}' ($(date -u +%Y-%m-%d)) [auto]"
          else
            # Sujet écarté par la gate, ou sujets ajoutés par le remplissage : la file seule
            # (sinon le sujet écarté reviendrait au passage suivant).
            git add data/topic-queue.json
            message="chore(blog): file de sujets mise à jour ($(date -u +%Y-%m-%d)) [auto]"
          fi
          if git diff --cached --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "$message"
          # push robuste : rebase + retry (évite les collisions concurrentes avec daily-news-summary sur main)
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Push refusé (collision concurrente ?) — rebase puis retry $i/5"
            # --autostash : sans publication, le brouillon d'un sujet écarté reste hors commit
            git pull --rebase --autostash origin main || { echo "Rebase impossible"; exit 1; }
            sleep 3
          done
          echo "Push définitivement échoué après 5 tentatives"; exit 1

      - name: Ping IndexNow (si publié)
        if: steps.gen.outputs.status == 'published' && steps.gen.outputs.url != ''
        continue-on-error: true
        run: node scripts/indexnow-ping.js "${{ steps.gen.outputs.url }}"

      - name: Notifie la publication (email)
        if: steps.gen.outputs.status == 'published'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          LINKEDIN_SCHEDULED: ${{ steps.li.outputs.scheduled }}
        run: node scripts/blog/notify-publish.mjs "${{ steps.gen.outputs.slug }}" "${{ steps.gen.outputs.url }}"

      - name: Prévient si la file baisse (email)
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
        run: node scripts/blog/notify-queue.mjs

      - name: Alerte si panne
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="⚠️ Blog autopilot en panne"
          body="Le pilote auto a échoué le $(date -u +%Y-%m-%dT%H:%MZ).
          Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Causes probables : secret GEMINI_API_KEY / ANTHROPIC_API_KEY (ou CLAUDE) manquant ou expiré, quota Gemini épuisé, file de sujets vide, ou étape de publication cassée.

          (Rappel : aucune alerte n'est envoyée quand un article est publié, ni quand la gate écarte volontairement un article jugé trop faible — c'est le fonctionnement normal.)"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
